<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="about">
    <h1>About Me</h1>
    <div class="about-grid">
      <div class="about-text">
        <p>Hello! I'm a beginner web developer learning HTML and CSS. This is my portfolio.</p>
      </div>
      <div class="about-image">
        <img src="profile.jpg" alt="Profile Picture">
 
           
      </div>
    </div>
  </section>
  <!--potfolio section -->

  <section id="portfolio">
    <h2>My Projects</h2>
    <div class="portfolio-grid">
      <div class="portfolio-item">Project 1</div>
      <div class="portfolio-item">Project 2</div>
      <div class="portfolio-item">Project 3</div>
    </div>
  </section>

  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      
      <label for="message">Message:</label>
      <textarea id="message" name="message" required></textarea>
      
      <button type="submit" onclick="alert('form submited')">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2024 Personal Portfolio</p>
  </footer>
</body>
</html>
